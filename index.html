}

<div class="card rv"><p class="mut" style="margin-bottom:12px">Log as ${N(me)} (local time)</p><div class="row"><div><label>Woke on</label><input id="sd" type="date" value="${today()}"></div><div><label>Fell asleep</label><input id="sb" type="time" value="${mine?mine.bed:'23:30'}"></div><div><label>Woke up</label><input id="sw" type="time" value="${mine?mine.wake:'07:30'}"></div></div><br><button class="btn c" onclick="logSleep()">${ic('plus')} Save night</button></div>
${A&&L?`<div class="row rv"><div class="card sage"><p class="mut">${N('arya')} avg</p><h2 style="margin:0">${fh(A.d)}</h2></div><div class="card lav"><p class="mut">${N('alya')} avg</p><h2 style="margin:0">${fh(L.d)}</h2></div></div><p class="mut rv" style="margin:0 0 16px 8px">Bedtimes differ by ${fh(Math.abs(A.b-L.b))} on average, difference in sleep ${fh(Math.abs(A.d-L.d))}.</p>`:''}
${days.map(d=>{const a=v.find(e=>e.who=='arya'&&e.date==d),l=v.find(e=>e.who=='alya'&&e.date==d);return `<div class="card rv"><p class="mut">${new Date(d).toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'})}</p><div style="margin-top:12px;font-size:13px">${N('arya')} ${a?a.bed+' to '+a.wake+', '+fh(dur(a)):'no entry'}</div>${tr(a)}<div style="font-size:13px">${N('alya')} ${l?l.bed+' to '+l.wake+', '+fh(dur(l)):'no entry'}</div>${tr(l)}<div class="row mut" style="font-size:11px;justify-content:space-between;display:flex"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>`}).join('')||'<div class="empty"><span class="hand">no nights yet</span>Log the first one above.</div>'}`}
if(tab=='film'){const L=D.movies.filter(x=>x.status==wt);
return `<h2 class="rv">Our <span class="hand">films</span></h2><div class="rv" style="position:relative;margin-bottom:16px"><input id="q" placeholder="Search a movie or series" onkeydown="event.key=='Enter'&&find()"></div>
<div id="res" class="grid" style="margin-bottom:16px">${sr.map((x,i)=>x.manual?`<button class="btn" onclick="addM(${i})">${ic('plus')} Add "${x.title}"</button>`:`<div class="poster" onclick="addM(${i})" style="cursor:pointer">${x.poster?`<img src="${x.poster}" loading="lazy">`:''}<div class="ov">${x.title} ${x.year}<div class="acts"><button>Add</button></div></div></div>`).join('')}</div>
<div class="seg2 rv">${[['want','Watchlist'],['now','Watching'],['done','Watched']].map(([k,n])=>`<button class="${wt==k?'on':''}" onclick="wt='${k}';draw()">${n}</button>`).join('')}</div>
<div class="grid">${L.map(m=>`<div class="poster rv">${m.poster?`<img src="${m.poster}" loading="lazy">`:''}<div class="ov"><b>${m.title}</b><div class="acts">${['want','now','done'].filter(k=>k!=m.status).map(k=>`<button onclick="mv('${m.id}','${k}')">${{want:'List',now:'Watching',done:'Watched'}[k]}</button>`).join('')}<button style="flex:0 0 30px" onclick="rm('movies','${m.id}')">${ic('x')}</button></div></div></div>`).join('')}</div>${L.length?'':'<div class="empty"><span class="hand">empty for now</span>Search above to add one.</div>'}`}
if(tab=='pet'){const xp=D.pet.xp,lv=Math.floor(xp/100),sc=.78+Math.min(lv,10)*.035,st=['Tiny','Curious','Playful','Grown','Radiant'][Math.min(lv,4)],ds=today();
const did=(w,a)=>D.pet.log&&D.pet.log[`${ds}:${w}:${a}`],both=['arya','alya'].every(w=>['feed','play','rest'].some(a=>did(w,a)));
return `<h2 class="rv">Raise <span class="hand">${s.pet}</span></h2><div class="card lav rv" style="text-align:center"><svg id="pc" onclick="burst()" viewBox="0 0 200 200" style="width:260px;cursor:pointer;transform:scale(${sc});transition:transform 1.4s cubic-bezier(.2,.7,.2,1)"><ellipse cx="100" cy="188" rx="54" ry="7" fill="#292524" opacity=".08"/><g class="pet"><path class="tail" d="M158 160q38-6 26-48" stroke="#FFB7B2" stroke-width="15" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="146" rx="52" ry="40" fill="#FFF1EC"/><ellipse cx="80" cy="180" rx="16" ry="9" fill="#FFF1EC"/><ellipse cx="120" cy="180" rx="16" ry="9" fill="#FFF1EC"/><path d="M42 72Q38 26 74 42Q60 54 56 74Z" fill="#FFF1EC"/><path d="M158 72Q162 26 126 42Q140 54 144 74Z" fill="#FFF1EC"/><path d="M50 66Q50 42 67 49Z" fill="#FFB7B2"/><path d="M150 66Q150 42 133 49Z" fill="#FFB7B2"/><ellipse cx="100" cy="96" rx="68" ry="56" fill="#FFF1EC"/><ellipse cx="72" cy="98" rx="9" ry="11" fill="#292524" class="eye"/><ellipse cx="128" cy="98" rx="9" ry="11" fill="#292524" class="eye"/><circle cx="75.5" cy="93" r="3.6" fill="#fff"/><circle cx="131.5" cy="93" r="3.6" fill="#fff"/><circle cx="69" cy="102" r="1.8" fill="#fff"/><circle cx="125" cy="102" r="1.8" fill="#fff"/><ellipse cx="51" cy="114" rx="10" ry="6" fill="#FFB7B2" opacity=".75"/><ellipse cx="149" cy="114" rx="10" ry="6" fill="#FFB7B2" opacity=".75"/><path d="M96 108h8l-4 5Z" fill="#e8847d"/><path d="M100 113q-5 8-11 3M100 113q5 8 11 3" stroke="#292524" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M38 102l-14-3M38 110l-14 4M162 102l14-3M162 110l14 4" stroke="#d6cfc9" stroke-width="2" stroke-linecap="round"/>${lv>=1?'<path d="M100 40l-20-12v24ZM100 40l20-12v24Z" fill="#b9b3d9"/><circle cx="100" cy="40" r="5" fill="#9c95c8"/>':''}${lv>=3?'<circle cx="150" cy="52" r="7" fill="#FFB7B2"/><circle cx="150" cy="52" r="3" fill="#FDFCF8"/>':''}</g></svg><p class="hand" style="font-size:30px;line-height:1">${both?"so loved today":"waiting for you"}</p><p class="mut">${st}, level ${lv+1}</p><div class="bar" style="margin:12px 0 4px"><i style="width:${xp%100}%"></i></div><p class="mut" style="font-size:13px">${100-xp%100} to next level. Caring on the same day earns a bonus.</p></div>
<div class="card rv"><p class="mut" style="margin-bottom:12px">Today, ${N(me)}</p><div class="row">${[['feed','Feed'],['play','Play'],['rest','Tuck in']].map(([k,n])=>`<button class="btn ${did(me,k)?'w':'c'}" ${did(me,k)?'disabled':''} onclick="care('${k}')">${did(me,k)?ic('heart'):''}${n}</button>`).join('')}</div></div>`}
if(tab=='us'){const md=D.mood&&D.mood.day==today()?D.mood:{},o=me=='arya'?'alya':'arya',B=D.bucket||[],NT=D.notes||[];
return `<h2 class="rv">Just <span class="hand">us</span></h2>
<div class="card rv"><p class="mut" style="margin-bottom:12px">How are you today, ${N(me)}?</p><div class="row">${Object.keys(MN).map(k=>`<button class="btn ${md[me]==k?'c':'w'}" onclick="mood('${k}')">${ic(k)} ${MN[k]}</button>`).join('')}</div>${md[o]?`<p class="mut" style="margin-top:14px">${N(o)} is feeling ${MN[md[o]]}.</p>`:''}</div>
<div class="card lav rv"><p class="mut" style="margin-bottom:10px">Leave a note</p><input id="nt" maxlength="140" placeholder="Something small for ${N(o)}" onkeydown="event.key=='Enter'&&note()"><br><br><button class="btn" onclick="note()">${ic('plus')} Send</button></div>
${NT.slice(0,6).map(n=>`<div class="card rv" style="transform:rotate(${n.from=='arya'?-1:1}deg)"><p class="hand" style="font-size:32px;line-height:1.1">${esc(n.text)}</p><p class="mut" style="font-size:13px;margin-top:8px">${N(n.from)}, ${new Date(n.at).toLocaleDateString('en',{day:'numeric',month:'short'})}${n.from==me?` <span onclick="rm('notes','${n.id}')" style="cursor:pointer;float:right">${ic('x')}</span>`:''}</p></div>`).join('')}
<h2 class="rv" style="margin-top:28px">Things we will <span class="hand">do</span></h2>
<div class="card sage rv"><input id="bk" placeholder="Add to our list" onkeydown="event.key=='Enter'&&bucket()"></div>
${B.map(b=>`<div class="card rv" style="padding:16px 20px;display:flex;gap:14px;align-items:center"><button class="btn sm ${b.done?'c':'w'}" onclick="tog('${b.id}',${!b.done})" aria-label="done">${ic('check')}</button><span style="flex:1;${b.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(b.text)}</span><span onclick="rm('bucket','${b.id}')" style="cursor:pointer;color:var(--mut)">${ic('x')}</span></div>`).join('')}`}
if(tab=='img')return `<h2 class="rv">Our <span class="hand">gallery</span></h2><label class="btn c rv" style="margin-bottom:20px">${ic('up')} Upload photos<input type="file" accept="image/*" multiple hidden onchange="upl(this)"></label><div class="cols">${D.photos.map((p,i)=>`<div class="ph" style="animation-delay:${i*60}ms"><img src="${p.file.startsWith('data:')?p.file:(cloud?SU[p.file]||'':'/uploads/'+p.file)}" loading="lazy" onclick="lb(this.src)"><button class="x" onclick="rm('photos','${p.id}')">${ic('trash')}</button></div>`).join('')}</div>${D.photos.length?'':'<div class="empty"><span class="hand">no photos yet</span>Upload the first one.</div>'}`;
return `<h2 class="rv">Our <span class="hand">settings</span></h2><div class="card rv"><label>Together since</label><input id="s1" type="date" value="${s.since}"><br><label>Names</label><div class="row"><input id="s2" value="${N('arya')}"><input id="s3" value="${N('alya')}"></div><br><label>Pet name</label><input id="s4" value="${s.pet}"><br><label>Next time we meet</label><input id="s5" type="date" value="${s.meet||''}"><br><br><button class="btn" onclick="saveS()">Save</button> <button class="btn w" onclick="delete localStorage.me;location.reload()">Switch person</button></div>`}
function draw(){if(!D)return;nav();const h=view();if(h!==last){last=h;$('#app').innerHTML=`<div class="view">${h}</div>`;reveal();const c=$('#cnt');if(c){const n=+c.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400);c.textContent=Math.round(n*(1-Math.pow(1-k,4)));k<1&&requestAnimationFrame(f)})(t0)}}}
function reveal(){const o=new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&(x.target.classList.add('in'),o.unobserve(x.target))),{threshold:.1});document.querySelectorAll('.rv').forEach((e,i)=>{e.style.transitionDelay=Math.min(i*70,350)+'ms';o.observe(e)})}
const logSleep=async()=>set(await api('/api/sleep','POST',{who:me,date:$('#sd').value,bed:$('#sb').value,wake:$('#sw').value}));
const care=async a=>{set(await api('/api/pet','POST',{who:me,act:a}));burst()};
function burst(){const e=$('#pc');if(!e)return;const c=e.parentNode;for(let i=0;i<6;i++){const x=document.createElement('span');x.className='hrt';x.style.left=30+Math.random()*40+'%';x.style.animationDelay=i*90+'ms';x.innerHTML=ic('us').replace('class="i"','class="i" style="fill:currentColor;stroke:none"');c.appendChild(x);setTimeout(()=>x.remove(),2100)}}
const mood=async m=>set(await api('/api/mood','POST',{who:me,m,day:today()}));
const note=async()=>{const t=$('#nt').value.trim();if(t)set(await api('/api/notes','POST',{from:me,text:t}))};
const bucket=async()=>{const t=$('#bk').value.trim();if(t)set(await api('/api/bucket','POST',{text:t}))};
const tog=async(i,v)=>set(await api('/api/bucket/'+i,'PATCH',{done:v}));
const find=async()=>{const q=$('#q').value.trim();if(!q)return;try{sr=await api('/api/search?q='+encodeURIComponent(q))}catch{sr=[{title:q,manual:1}]}last='';draw()};
const addM=async i=>{const x=sr[i];sr=[];set(await api('/api/movies','POST',{title:x.title,year:x.year||'',poster:x.poster||''}))};
const mv=async(i,s)=>set(await api('/api/movies/'+i,'PATCH',{status:s})),rm=async(k,i)=>set(await api(`/api/${k}/${i}`,'DELETE'));
const upl=async el=>{const f=new FormData();[...el.files].forEach(x=>f.append('f',x));f.append('who',me);set(await api('/api/photos','POST',f))};
const lb=s=>{$('#lb img').src=s;$('#lb').classList.add('on')};
const saveS=async()=>{set(await api('/api/settings','POST',{since:$('#s1').value,names:{arya:$('#s2').value,alya:$('#s3').value},pet:$('#s4').value,meet:$('#s5').value}));go('home')};
async function load(){try{set(await api('/api/state'))}catch{}}
setInterval(()=>document.querySelectorAll('.clk').forEach(e=>e.textContent=tm(e.dataset.z)),10000);
setInterval(()=>{if(!document.activeElement.matches('input'))load()},20000);
if(CFG.url&&window.supabase){cloud=true;sb=supabase.createClient(CFG.url,CFG.key);sb.auth.getSession().then(({data})=>data.session?(me?load():who()):clog())}else fetch('/api/state').then(r=>{if(r.status!=401&&(!r.ok||!(r.headers.get('content-type')||'').includes('json')))demo=true}).catch(()=>demo=true).finally(()=>{me?load():who()});
</script></body></html>
